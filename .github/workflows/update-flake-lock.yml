name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 00:00 UTC.
    - cron: '0 0 * * 0'

jobs:
  nixos:
    name: "nixos/flake.lock"
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          path-to-flake-dir: nixos/
          pr-title: "nixos: update flake.lock"
          pr-labels: |
            dependencies
            automated
            nixos
